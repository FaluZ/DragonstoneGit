name: security-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for known implant signatures (A8-3424-1 / EtherHiding campaign)
        run: |
          set -e
          LITERAL_PATTERN="global\.i=\"A8-|global\['!'\]=|global\['e'\]='app-[a-z]+-eval'|_\\\$_1e42|windowsHide.{0,80}detached|detached.{0,80}windowsHide|ETH_RPC_URL|eth\.blockscout\.com|ethereum-rpc\.publicnode\.com|eth\.drpc\.org|1rpc\.io/eth|blastapi\.io|SvcHostUpdate|97icr5|main\.inz\.cjs|q4FZkxX"
          RISKY_CONFIG_RE='(^|/)(vite\.config\.(js|ts|mjs|cjs)|webpack\.(config|mix)\.js|postcss\.config\.(js|cjs|mjs)|tailwind\.config\.(js|cjs|mjs)|babel\.config\.(js|cjs)|\.babelrc.*|next\.config\.(js|mjs)|rollup\.config\.js|jest\.config\.(js|cjs))$'
          MAXLEN=400
          FOUND=0

          # el propio hook/workflow contiene las firmas como texto de deteccion:
          # no auto-escanearse (mismo criterio que .githooks/pre-commit).
          is_self() {
            case "$1" in
              .githooks/*|.github/workflows/security-scan.yml|*.QUARANTINED) return 0 ;;
              *) return 1 ;;
            esac
          }

          echo "Buscando firmas literales conocidas en archivos rastreados..."
          while IFS= read -r f; do
            is_self "$f" && continue
            if [ -f "$f" ] && grep -qEa "$LITERAL_PATTERN" "$f" 2>/dev/null; then
              echo "::error file=$f::Firma conocida del implante encontrada en $f"
              FOUND=1
            fi
          done < <(git ls-files)

          echo "Buscando lineas anormalmente largas en config de build..."
          while IFS= read -r f; do
            is_self "$f" && continue
            if [ -f "$f" ]; then
              longest=$(awk '{ print length }' "$f" | sort -rn | head -1)
              if [ -n "$longest" ] && [ "$longest" -gt "$MAXLEN" ]; then
                echo "::error file=$f::Linea de $longest bytes (limite $MAXLEN) - patron identico al de infecciones previas"
                FOUND=1
              fi
            fi
          done < <(git ls-files | grep -E "$RISKY_CONFIG_RE")

          if [ -f ".vscode/tasks.json" ] && grep -q "folderOpen" ".vscode/tasks.json"; then
            echo "::error file=.vscode/tasks.json::runOn:folderOpen detectado (auto-ejecucion al abrir el proyecto)"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "Escaneo de seguridad fallido. Ver anotaciones arriba."
            exit 1
          fi
          echo "Escaneo de seguridad OK."
